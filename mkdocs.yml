# 사이트 설정
site_name: MayaMetaBridge — User Guide
site_url: https://mayalhc.github.io/MayaMetaBridge_Wiki/
site_author: chamiseul
site_description: MetaHuman in Maya 2027 — the MetaBridge DNA port

# 테마 설정 (metabridge_dna 와 같은 readthedocs 테마)
theme:
  name: readthedocs
  highlightjs: true
  collapse_navigation: false # 전체를 항상 펼침
  sticky_navigation: true
  navigation_depth: 4
  titles_only: false

# 네비게이션 (메뉴 구조)
nav:
  - MayaMetaBridge Guide:
    - "Welcome to MayaMetaBridge": index.md
    - "한국어 가이드": KO_index.md
  - Panel Reference:
    - "Panel Reference": panels.md
    - "패널 레퍼런스": KO_panels.md
  - "MetaBridge DNA (Blender)": https://mayalhc.github.io/metabridge_dna/

# 마크다운 확장 기능
markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
